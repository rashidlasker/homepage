<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rashid Lasker</title>
    <meta name="description" content="Rashid Lasker — builder working on interfaces, complex frontend systems, and user interactions." />
    <meta name="author" content="Rashid Lasker" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1C1814" media="(prefers-color-scheme: dark)" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Rashid Lasker" />
    <meta property="og:description" content="Builder working on interfaces, complex frontend systems, and user interactions." />
    <meta property="og:url" content="https://rashidlasker.com" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:site" content="@rashidlasker" />
    <meta name="twitter:title" content="Rashid Lasker" />
    <meta name="twitter:description" content="Builder working on interfaces, complex frontend systems, and user interactions." />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/favicon.png" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;600&family=Special+Elite&family=Courier+Prime:wght@400;700&family=IBM+Plex+Mono:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap"
      as="style"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;600&family=Special+Elite&family=Courier+Prime:wght@400;700&family=IBM+Plex+Mono:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        var allowed = ["roboto", "special-elite", "courier-prime", "ibm-plex", "space-mono"];
        var key = new URLSearchParams(location.search).get("font");
        if (key && allowed.indexOf(key) !== -1) {
          document.documentElement.setAttribute("data-font", key);
        }
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/react-app/main.tsx"></script>
  </body>
</html>
